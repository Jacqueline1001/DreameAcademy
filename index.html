<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreame Academy for promoters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --ink:#171A2E; --muted:#585C75; --line:#DADCE6;
  --us:#2F45D8; --us-soft:#E7EAFD; --on-us:#FFFFFF;
  --them:#A9570B; --them-soft:#FCEBD9;
  --ok:#1C7A4B; --ok-soft:#DFF3E8; --bad:#B3261E; --bad-soft:#FBE3E1;
  --plate:#FFFFFF;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131C; --surface:#1B1E2B; --ink:#ECEEF6; --muted:#A6AAC0; --line:#2E3244;
    --us:#8E9CFF; --us-soft:#232A57; --on-us:#0F1230;
    --them:#F2A95E; --them-soft:#3A2916;
    --ok:#62D59E; --ok-soft:#173527; --bad:#FF8F85; --bad-soft:#3D1D1B;
    --plate:#F3F3F6; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131C; --surface:#1B1E2B; --ink:#ECEEF6; --muted:#A6AAC0; --line:#2E3244;
  --us:#8E9CFF; --us-soft:#232A57; --on-us:#0F1230;
  --them:#F2A95E; --them-soft:#3A2916;
  --ok:#62D59E; --ok-soft:#173527; --bad:#FF8F85; --bad-soft:#3D1D1B;
  --plate:#F3F3F6; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--us);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-0.01em}
p{margin:0}
.muted{color:var(--muted)}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand span{color:var(--us)}
.bar nav{margin-left:auto;display:flex;gap:4px}
.bar nav a{text-decoration:none;color:var(--muted);font-weight:700;font-size:15px;padding:8px 10px;border-radius:8px}
.brand em{font-style:normal}
@media (max-width:420px){.bar nav a{padding:8px 7px;font-size:14px}.brand .acad{display:none}}
.bar nav a[aria-current="page"]{color:var(--ink);background:var(--surface)}

/* hero */
.hero{padding:34px 0 26px}
.hero h1{font-size:clamp(34px,8vw,54px);font-weight:800;max-width:14ch}
.hero .lead{margin-top:14px;color:var(--muted);max-width:52ch}
.chat{margin-top:26px;display:flex;flex-direction:column;gap:10px;max-width:520px}
.bubble{padding:12px 16px;border-radius:18px;max-width:88%;font-size:16px;line-height:1.4}
.bubble small{display:block;font-weight:700;font-size:13px;margin-bottom:2px}
.b-them{background:var(--them-soft);border-bottom-left-radius:6px;align-self:flex-start}
.b-them small{color:var(--them)}
.b-us{background:var(--us);color:var(--on-us);border-bottom-right-radius:6px;align-self:flex-end}
.b-us small{color:inherit;opacity:.85}
.typing{align-self:flex-end;background:var(--us-soft);padding:12px 16px;border-radius:18px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--us);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
.pop{animation:pop .35s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes gone{to{opacity:0;height:0;padding:0;margin-top:-10px;overflow:hidden}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}

/* product list */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.sec-h h2{font-size:24px;font-weight:800}
.plist{display:grid;gap:10px}
@media (min-width:640px){.plist{grid-template-columns:1fr 1fr}}
.pitem{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px;text-decoration:none;color:inherit}
.pitem:hover{border-color:var(--us)}
.plate{background:var(--plate);border-radius:10px;flex:none;display:grid;place-items:center;overflow:hidden}
.pitem .plate{width:74px;height:74px}
.pitem .plate img{max-height:66px;max-width:66px;object-fit:contain}
.pitem h3{font-size:18px;font-weight:800}
.pitem .cat{font-size:14px;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--us);border-radius:6px;transition:width .4s}
.prog-t{font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:grid;gap:10px;margin:14px 0 40px}
@media (min-width:640px){.actions{grid-template-columns:1fr 1fr}}
.act{display:block;text-decoration:none;color:inherit;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.act h3{font-size:20px;font-weight:800;margin-bottom:4px}
.act.primary{background:var(--us);color:var(--on-us);border-color:var(--us)}
.act.primary p{opacity:.9}

/* product page */
.back{display:inline-block;margin:18px 0 8px;color:var(--muted);text-decoration:none;font-weight:700;font-size:15px}
.phead{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding-bottom:18px}
.phead .plate{width:120px;height:120px}
.phead .plate img{max-width:108px;max-height:108px;object-fit:contain}
.phead h1{font-size:clamp(30px,7vw,44px);font-weight:800}
.phead .tag{font-family:var(--display);font-weight:600;font-size:18px;color:var(--us);margin-top:4px}
.what{color:var(--muted);margin-top:6px}
.ideal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:16px}
.ideal strong{font-family:var(--display)}
@media (max-width:480px){.phead{grid-template-columns:88px 1fr;gap:14px}.phead .plate{width:88px;height:88px}.phead .plate img{max-width:80px;max-height:80px}}

.tabs{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 8px;font-weight:700;font-size:15px;white-space:nowrap}
@media (max-width:420px){.tabs button{font-size:13.5px;padding:9px 4px}}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{padding:14px 0 50px}

/* KSP stepper */
.stepinfo{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:15px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;padding:0}
.dots button.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
.ksp{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.ksp .big{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,72px);line-height:1;color:var(--us);letter-spacing:-0.02em}
.ksp h2{font-size:26px;font-weight:800;margin-top:8px}
.ksp .simple{margin-top:10px;max-width:60ch}
.say{margin-top:18px;background:var(--us-soft);border-radius:14px;padding:14px 16px}
.say .lbl,.demo .lbl{font-weight:700;font-size:14px;color:var(--us);margin-bottom:4px}
.say q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;quotes:"“" "”"}
.demo{margin-top:12px;border:1px dashed var(--line);border-radius:14px;padding:12px 16px}
.demo .lbl{color:var(--ink)}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;font-weight:700}
.btn.main{background:var(--us);color:var(--on-us);border-color:var(--us)}
.btn.main.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* light selector (Chrona) */
.lights{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.lights h2{font-size:22px;font-weight:800}
.swatches{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:15px}
.sw i{width:24px;height:24px;border-radius:50%;flex:none}
.sw[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--ink)}
.lightbody{display:grid;gap:16px}
@media (min-width:600px){.lightbody{grid-template-columns:240px 1fr}}
.lightbody img{border-radius:12px;width:100%;aspect-ratio:5/3;object-fit:cover}
.nm{font-weight:700;color:var(--muted);font-size:15px}
.stat{font-family:var(--display);font-weight:800;font-size:28px;margin-top:8px}
.stat small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}

/* compare */
.rivals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rivals button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px}
.rivals button[aria-pressed="true"]{border-color:var(--them);background:var(--them-soft);color:var(--ink)}
.duel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.duel h2{font-size:24px;font-weight:800}
.duel h2 .vs{color:var(--muted);font-weight:600}
.where{font-size:15px;color:var(--muted);margin-top:6px}
.duel .chat{max-width:none;margin-top:18px}
.reveal{align-self:flex-end;border:2px dashed var(--us);background:transparent;color:var(--us);border-radius:18px;padding:12px 16px;font-weight:700;max-width:88%;text-align:left}
.score{display:grid;gap:12px;margin-top:20px}
@media (min-width:600px){.score{grid-template-columns:1fr 1fr}}
.col{border-radius:14px;padding:14px 16px}
.col h3{font-size:17px;font-weight:800;margin-bottom:8px}
.col ul{margin:0;padding-left:20px}
.col li{margin:5px 0}
.col.us{background:var(--us-soft)}
.col.us h3{color:var(--us)}
.col.them{background:var(--them-soft)}
.col.them h3{color:var(--them)}
.careful{margin-top:12px;border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:0 12px 12px 0;padding:12px 14px;font-size:16px}
.careful strong{color:var(--bad)}
.tablebox{overflow-x:auto;margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-family:var(--display);font-weight:800;font-size:15px}
tbody th{color:var(--muted);font-weight:700;white-space:nowrap}
td.us,th.us{background:var(--us-soft)}
th.us{color:var(--us)}
tr:last-child th,tr:last-child td{border-bottom:none}
.note{font-size:14px;color:var(--muted);margin-top:8px}

.honest{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}
.honest h2{font-size:22px;font-weight:800;margin-bottom:6px}

/* faq */
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--display);font-size:22px;line-height:1;color:var(--us)}
details[open] summary::after{content:"–"}
details .a{padding:0 16px 16px;color:var(--ink)}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.quiz h2{font-size:22px;font-weight:800;line-height:1.25}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--us)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px}
.fb.right{background:var(--ok-soft)}
.fb.wrong{background:var(--bad-soft)}
.fb strong{display:block}
.result{text-align:center;padding:16px 0}
.result .big{font-family:var(--display);font-weight:800;font-size:64px;color:var(--us);line-height:1}
.ptag{display:inline-block;font-size:13px;font-weight:700;background:var(--us-soft);color:var(--us);border-radius:6px;padding:2px 8px}

/* rules */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;display:grid;gap:10px}
@media (min-width:600px){.rule{grid-template-columns:1fr 1fr}}
.rule .no,.rule .yes{border-radius:12px;padding:12px 14px}
.rule .no{background:var(--bad-soft)}
.rule .yes{background:var(--ok-soft)}
.rule .no p{text-decoration:line-through;text-decoration-color:var(--bad)}
.rule .lbl{font-weight:700;font-size:14px;margin-bottom:4px}
.rule .no .lbl{color:var(--bad)} .rule .yes .lbl{color:var(--ok)}
.check{background:var(--ink);color:var(--bg);border-radius:16px;padding:20px;margin:16px 0 40px}
.check h3{font-size:20px;font-weight:800;margin-bottom:6px}
.pagehead{padding:24px 0 14px}
.pagehead h1{font-size:clamp(30px,7vw,44px);font-weight:800}
.pagehead p{color:var(--muted);margin-top:8px;max-width:56ch}
footer{color:var(--muted);font-size:13px;padding:10px 0 40px;border-top:1px solid var(--line);margin-top:20px}
.reset{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}

/* hero v2 */
.hero{padding:30px 0 22px}
.hero h1.wordmark{font-size:clamp(44px,12vw,76px);font-weight:800;letter-spacing:-0.03em;max-width:none}
.rotator{font-family:var(--display);font-weight:600;font-size:clamp(22px,5.4vw,32px);line-height:1.2;color:var(--us);min-height:2.5em;margin-top:6px;overflow:hidden}
.rotator span{display:inline-block;transition:transform .35s ease,opacity .35s ease}
.rotator span.out{transform:translateY(-60%);opacity:0}
.rotator span.in{transform:translateY(60%);opacity:0;transition:none}
.how{list-style:none;counter-reset:s;padding:0;margin:18px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.how li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.how li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.democard{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.demohead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:15px}
.ptag{text-decoration:none}
.democard .chat{margin-top:12px;min-height:190px;max-width:none}
.demonav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px}
/* competitor v2 */
.rivalpick{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.rivalpick button{flex:none;width:112px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13.5px;line-height:1.2;text-align:center}
.rivalpick button[aria-pressed="true"]{border-color:var(--them);box-shadow:0 0 0 2px var(--them)}
.rp-img{width:92px;height:72px;background:var(--plate);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.rp-img img{max-width:88px;max-height:68px;object-fit:contain}
.rp-img svg{width:64px;height:64px}
.faceoff{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{margin:0;text-align:center}
.fplate{background:var(--plate);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border:3px solid transparent}
.side.us .fplate{border-color:var(--us)}
.side.them .fplate{border-color:var(--them)}
.fplate img{max-width:88%;max-height:88%;object-fit:contain}
.fplate svg,.svgplate svg{width:86%;height:86%}
.svgplate{width:100%;height:100%;display:grid;place-items:center;align-self:stretch;justify-self:stretch}
.fplate .svgplate svg{width:92%;height:92%}
.demohead .ptag{white-space:nowrap}
.side figcaption{font-family:var(--display);font-weight:800;font-size:16px;margin-top:6px}
.side.us figcaption{color:var(--us)} .side.them figcaption{color:var(--them)}
.vsmark{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.chips{display:flex;justify-content:center;gap:4px;margin-top:6px}
.chips i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.duel .where{text-align:center;margin-top:10px}
.remember{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px 18px}
.remember .lbl{font-size:14px;font-weight:700;opacity:.75;margin-bottom:4px}
.remember p{font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,26px);line-height:1.2}
.h2h{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.h2h-head,.h2h-row{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center}
.h2h-head{font-family:var(--display);font-weight:800;font-size:14px;background:var(--bg)}
.h2h-head span{padding:8px 10px}
.h2h-head span:first-child{color:var(--us)} .h2h-head span:last-child{color:var(--them);text-align:right}
.h2h-row{border-top:1px solid var(--line)}
.h2h-row .l{text-align:center;font-size:13.5px;color:var(--muted);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.h2h-row .v{padding:10px;font-weight:700;font-size:15px;line-height:1.25}
.h2h-row .v.them{text-align:right}
.h2h-row .v.win{background:var(--us-soft);color:var(--us)}
.h2h-row .v.them.win{background:var(--them-soft);color:var(--them)}
.tie{font-size:12px;font-weight:700;background:var(--line);color:var(--ink);border-radius:6px;padding:1px 6px}
.subh{font-size:20px;font-weight:800;margin-top:22px}
.fairdont{display:grid;gap:10px;margin-top:14px}
@media (min-width:600px){.fairdont{grid-template-columns:1fr 1fr}}
.fair,.dont{border-radius:12px;padding:12px 14px;font-size:16px}
.fair{background:var(--them-soft)} .fair .lbl{color:var(--them)}
.dont{background:var(--bad-soft)} .dont .lbl{color:var(--bad)}
.fair .lbl,.dont .lbl{font-weight:700;font-size:14px;margin-bottom:2px}
.drillq{margin-top:10px}
.dq{font-weight:700;font-size:18px}
.fulltable{margin-top:16px}

.ptag2 .sweep{position:absolute;left:0;right:0;bottom:-6px;height:6px;border-radius:6px;background:var(--us);opacity:.25;transform-origin:left;animation:sweep .8s ease-out 1.2s both}

/* contact */

/* temps */

.g-pulse{text-align:center}
.g-pulse svg{width:100%;max-width:360px;height:80px}
.g-pulse .ecg{stroke-dasharray:520;stroke-dashoffset:520;animation:ecg 2.4s linear infinite}

@media (prefers-reduced-motion: reduce){.kmedia img{transform:none;transition:none}.l5 i{animation:none;opacity:1}.g-pulse .ecg{animation:none;stroke-dashoffset:0}.tlbar b,.tbar i,.g-timer .ring{transition:none}}

.flow .st{background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px}
.flow.us .st{background:var(--us-soft);color:var(--us)}
.flow .ar{font-style:normal;color:var(--muted)}
.flow .fc{grid-row:1;grid-column:2;justify-self:end;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--muted)}
.flow.us .fc{background:var(--us);color:var(--on-us)}
@media (prefers-reduced-motion: reduce){.tile{opacity:1;transform:none;animation:none!important}.bw i{transition:none}}

.exfull{display:grid;gap:14px;background:var(--ink);color:var(--bg);border-radius:18px;padding:20px;align-items:end}
@media (min-width:640px){.exfull{grid-template-columns:1fr auto}}
.exfull h2{font-size:26px;font-weight:800;margin-top:8px}
.exfull p{opacity:.85;margin-top:4px;max-width:46ch}
.exfull .best{opacity:1;font-weight:700}
.exfull .ptag{background:rgba(255,255,255,.15);color:inherit}
.exfull .btn.main{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.exlist{display:grid;gap:10px;margin-bottom:30px}
@media (min-width:640px){.exlist{grid-template-columns:1fr 1fr}}
.exitem{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px}
.exitem:hover{border-color:var(--us)}
.exitem .plate{width:56px;height:56px}
.exitem .plate img{max-width:50px;max-height:50px;object-fit:contain}
.exinfo{flex:1;min-width:0}.exinfo b{display:block;font-family:var(--display);font-size:17px}.exinfo small{color:var(--muted);font-size:13.5px}
.exstate{font-weight:700;font-size:13.5px;border-radius:999px;padding:4px 12px;background:var(--us-soft);color:var(--us)}
.exstate.pass{background:var(--ok-soft);color:var(--ok)}
.qprodtag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);background:var(--us-soft);border-radius:999px;padding:3px 12px 3px 3px}
.qprodtag img{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:contain}
.qtype{font-size:13.5px;color:var(--muted);margin:2px 0 6px}
.bypr{display:grid;gap:6px;margin:16px auto 0;max-width:380px;text-align:left}
.bypr div{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:6px 12px 6px 6px;font-size:15px}
.bypr img{width:30px;height:30px;object-fit:contain;background:#fff;border-radius:8px}
.bypr span{flex:1}.bypr .ok b{color:var(--ok)}.bypr .low b{color:var(--bad)}

.kphoto{margin:-22px -22px 18px;background:var(--plate);border-radius:18px 18px 0 0;padding:16px;display:flex;justify-content:center}
.kphoto img{display:block;max-width:100%;max-height:190px;width:auto;height:auto;object-fit:contain;border-radius:10px}
.kphoto .zoom{position:relative;border:none;background:none;padding:0;cursor:zoom-in}
.zhint{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:700;background:rgba(20,22,35,.72);color:#fff;border-radius:999px;padding:4px 10px}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,11,18,.88);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);animation:pop .25s ease-out;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.lbclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:24px;line-height:1}

.medal{display:inline-grid;place-items:center;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 4px 12px -4px rgba(0,0,0,.3);vertical-align:middle}
.medal svg{width:58%;height:58%}
.medal.none{background:var(--line);color:var(--muted);font-weight:700;box-shadow:none}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 16px}
.ladder div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.ladder b{display:block;font-family:var(--display);font-size:14px;margin-top:4px}
.ladder small{color:var(--muted);font-size:12px}
.result .ladder{margin:16px 0 0}
.partsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.partsum span{background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:13.5px;color:var(--muted)}
.partsum b{display:block;font-family:var(--display);font-size:24px;color:var(--ink)}
.mybest{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:4px}
.partintro{text-align:center;padding:30px 20px}
.partintro h2{font-size:28px;margin-top:10px}
.partintro .btnrow{justify-content:center}
.medalwrap{display:flex;justify-content:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.lvname{font-family:var(--display);font-weight:800;font-size:22px;margin:10px 0 6px}
.nextlv{display:inline-block;margin-top:10px;background:var(--us-soft);color:var(--us);border-radius:999px;padding:6px 14px;font-size:14px}
.bytype{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px auto 0;max-width:420px}
.bytype div{background:var(--bg);border-radius:10px;padding:8px}
.bytype small{display:block;font-size:12px;color:var(--muted)}
.bytype b{font-family:var(--display);font-size:18px}
.exitem .lv{display:block;color:var(--ink);font-weight:700}
.exfull .best{display:flex;align-items:center;gap:8px}
</style>
</head>

/* Illustration of an LED mask: dots show which lights it uses */
function maskSVG(m){
  const face="M100 14 C150 14 174 50 172 96 C170 142 142 182 100 186 C58 182 30 142 28 96 C26 50 50 14 100 14Z";
  const inEye=(x,y)=>((x-70)**2/18**2+(y-86)**2/10**2<1.3)||((x-130)**2/18**2+(y-86)**2/10**2<1.3);
  const inMouth=(x,y)=>((x-100)**2/18**2+(y-152)**2/7**2<1.4);
  const pts=[];
  for(let y=30;y<=176;y+=11){for(let x=36;x<=164;x+=11){
    const dx=(x-100)/64, dy=(y-100)/80; if(dx*dx+dy*dy>0.92) continue;
    if(inEye(x,y)||inMouth(x,y)) continue; pts.push([x,y]);
  }}
  const step=m.sparse?2:1;
  const dots=pts.filter((_,i)=>i%step===0).map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.8" fill="${m.c[(i+Math.floor(y/11))%m.c.length]}"/>`).join("");
  const holes=`<ellipse cx="70" cy="86" rx="17" ry="9" fill="#FFFFFF" stroke="#CFCAC2" stroke-width="2"/><ellipse cx="130" cy="86" rx="17" ry="9" fill="#FFFFFF" stroke="#CFCAC2" stroke-width="2"/><ellipse cx="100" cy="152" rx="15" ry="5" fill="#FFFFFF" stroke="#CFCAC2" stroke-width="2"/>`;
  const shell=m.rigid?`<path d="${face}" fill="none" stroke="#7E8299" stroke-width="10"/>`:"";
  const cool=m.cool?`<ellipse cx="70" cy="108" rx="13" ry="6" fill="#8FD3FF" stroke="#fff" stroke-width="2"/><ellipse cx="130" cy="108" rx="13" ry="6" fill="#8FD3FF" stroke="#fff" stroke-width="2"/>`:"";
  const vibe=m.vibe?`<path d="M14 84 q7 12 0 24 M186 84 q-7 12 0 24 M4 76 q12 20 0 40 M196 76 q-12 20 0 40" stroke="#7E8299" stroke-width="3" fill="none" stroke-linecap="round"/>`:"";
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Illustration of the mask and its lights"><path d="${face}" fill="#F3F0EB" stroke="#D6D1C9" stroke-width="2"/>${dots}${holes}${cool}${shell}${vibe}</svg>`;
}

let IO=null;
function observe(root=document){
  if(RM||!("IntersectionObserver" in window)){root.querySelectorAll(".rv").forEach(e=>e.classList.add("vis"));root.querySelectorAll("[data-count]").forEach(e=>e.textContent=e.dataset.count);return;}
  if(!IO) IO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("vis");e.target.querySelectorAll("[data-count]").forEach(countUp);if(e.target.dataset.count)countUp(e.target);IO.unobserve(e.target);}}),{threshold:.15,rootMargin:"0px 0px -6% 0px"});
  root.querySelectorAll(".rv:not(.vis)").forEach((e,i)=>{e.style.transitionDelay=Math.min(i%6,5)*60+"ms";IO.observe(e);});
}
function countUp(el){
  const t=el.dataset.count; if(!t||el.dataset.done) return; el.dataset.done=1;
  const m=t.match(/^([^\d]*)([\d,]+(?:\.\d+)?)(.*)$/); if(!m||RM){el.textContent=t;return;}
  const [,pre,numS,suf]=m, num=parseFloat(numS.replace(/,/g,"")), dec=(numS.split(".")[1]||"").length, comma=numS.includes(",");
  const t0=performance.now(), D=1100;
  (function f(now){const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3), v=(num*e).toFixed(dec);
    el.textContent=pre+(comma?Number(v).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec}):v)+suf;
    if(k<1) requestAnimationFrame(f);})(t0);
}

const PARTINFO={s:["Part A","Single choice","Pick the one best answer."],m:["Part B","Select all that apply","Pick every correct option, then tap Check answer. All must be right to score."],tf:["Part C","True or false","Decide if the statement is true or false."]};
const LEVELS=[
 {min:100,name:"Master",tier:"Diamond",c1:"#5B6CFF",c2:"#A35BFF",msg:"Perfect score. You can train others."},
 {min:90,name:"Expert",tier:"Gold",c1:"#F2B33D",c2:"#D98A0B",msg:"Excellent. You know this cold."},

const levelOf=(score,total)=>{const pct=score/total*100;return LEVELS.find(l=>pct>=l.min)||null;};
const nextLevel=(score,total)=>{const pct=score/total*100;const up=[...LEVELS].reverse().find(l=>l.min>pct);return up?{...up,need:Math.ceil(up.min/100*total)-score}:null;};

function examRunner(cfg){
  const host=cfg.el||$("#app"), qs=cfg.qs; let i=0,score=0,missed=[],sel;
  const back=cfg.onBack||(()=>renderReto());
  const top=()=>{ if(!cfg.el){window.scrollTo(0,0);} else { const t=$(".tabs"); if(t) window.scrollTo({top:Math.max(0,t.offsetTop-56)}); } };
  function shell(inner){
    host.innerHTML=cfg.el?inner:`<a class="back" href="#reto" id="exback">← All exams</a><div class="pagehead" style="padding-top:6px"><h1 style="font-size:clamp(26px,6vw,36px)">${esc(cfg.title)}</h1></div>${inner}`;
    const b=$("#exback"); if(b) b.onclick=e=>{e.preventDefault();back();};

    shell(`<div class="quiz partintro qanim"><div class="exbar"><b style="width:${i/qs.length*100}%"></b></div>
      <span class="ptag">${P[0]}</span><h2>${P[1]}</h2><p class="muted" style="margin-top:6px">${n} questions. ${P[2]}</p>
      <div class="btnrow"><button class="btn main" id="pgo">Begin ${P[0]}</button></div></div>`);
    $("#pgo").onclick=q; top();
  }
  function step(){ (i===0||qs[i].t!==qs[i-1].t)?intro(qs[i].t):q(); }
  function q(){

    shell(`<div class="quiz qanim">

      <div class="qmeta">${cfg.tag===false?`<span>${PART[Q.t]}</span>`:`<span class="qprodtag"><img src="${IMG[P.img]}" alt="">${esc(P.name)}</span>`}<span>${i+1} / ${qs.length}</span></div>
      ${cfg.tag===false?"":`<p class="qtype">${PART[Q.t]}</p>`}
      <h2>${esc(Q.q)}</h2>
      <div class="opts ${Q.t==="tf"?"tf":""}">${Q.o.map((o,j)=>`<button class="opt" data-j="${j}">${Q.t==="tf"?"":`<span class="letter">${"ABCD"[j]}</span>`}${esc(o)}</button>`).join("")}</div>

    const opts=[...host.querySelectorAll(".opt")];
    opts.forEach(b=>b.onclick=()=>{const j=+b.dataset.j;
      if(Q.t==="m"){sel.has(j)?sel.delete(j):sel.add(j);b.classList.toggle("picked");$("#chk").disabled=!sel.size;return;}
      sel=new Set([j]);grade();});
    if(Q.t==="m") $("#chk").onclick=grade;
    function grade(){
      const ok=Q.a.length===sel.size&&Q.a.every(x=>sel.has(x)); if(ok) score++; else missed.push(i);
      opts.forEach((x,xi)=>{x.disabled=true;x.classList.remove("picked");if(Q.a.includes(xi))x.classList.add("right");else if(sel.has(xi))x.classList.add("wrong");});
      const c=$("#chk"); if(c) c.remove();
      const ans=Q.a.map(x=>Q.t==="tf"?Q.o[x]:"ABCD"[x]).join(", ");
      $("#fb").innerHTML=`<div class="fb ${ok?"right":"wrong"}"><strong>${ok?"Correct!":"Not quite."}</strong>${ok?"":"Correct answer: "+ans}</div><div class="btnrow"><button class="btn main" id="nx">${i<qs.length-1?"Next question":"See result"}</button></div>`;
      $("#nx").onclick=()=>{i++;i<qs.length?step():end();};
    }
  }
  function end(){
    cfg.save(score);
    const L=levelOf(score,qs.length), N=nextLevel(score,qs.length), pct=Math.round(score/qs.length*100);
    const byP={}; qs.forEach((Q,k)=>{byP[Q.pid]=byP[Q.pid]||[0,0];byP[Q.pid][1]++;if(!missed.includes(k))byP[Q.pid][0]++;});
    const byT={s:[0,0],m:[0,0],tf:[0,0]}; qs.forEach((Q,k)=>{byT[Q.t][1]++;if(!missed.includes(k))byT[Q.t][0]++;});
    const multi=Object.keys(byP).length>1;
    shell(`<div class="quiz result qanim">
      <div class="medalwrap">${medal(L,96)}</div>
      <div class="lvname">${L?L.tier+" · "+L.name:"Keep learning"}</div>
      <div class="big" data-count="${score}">${score}</div><div class="muted">out of ${qs.length} · ${pct}%</div>
      <p style="margin-top:8px">${L?L.msg:"You need 50% to reach Trainee. Review the selling points and try again."}</p>
      ${N?`<p class="nextlv">${N.need} more correct to reach <b>${N.name}</b></p>`:""}
      ${ladder()}
      <div class="bytype">${Object.entries(byT).map(([t,r])=>`<div><small>${PARTINFO[t][1]}</small><b>${r[0]}/${r[1]}</b></div>`).join("")}</div>
      ${multi?`<div class="bypr">${PRODUCTS.map(P=>{const r=byP[P.id];return `<div class="${r[0]===r[1]?"ok":r[0]/r[1]<0.67?"low":""}"><img src="${IMG[P.img]}" alt=""><span>${esc(P.name)}</span><b>${r[0]}/${r[1]}</b></div>`}).join("")}</div>`:""}
      ${missed.length?`<details class="review"><summary>Review the ${missed.length} you missed</summary><div class="a">${missed.map(k=>{const Q=qs[k];const P=PRODUCTS.find(x=>x.id===Q.pid);return `<p>${multi?`<span class="ptag">${esc(P.name)}</span><br>`:""}<b>${esc(Q.q)}</b><br>✓ ${Q.a.map(x=>esc(Q.o[x])).join(" · ")}</p>`}).join("")}</div></details>`:""}
      <div class="btnrow" style="justify-content:center"><button class="btn main" id="again">Take it again</button><button class="btn" id="bk2">${cfg.backLabel||"All exams"}</button></div></div>`);
    host.querySelectorAll("[data-count]").forEach(countUp);
    $("#again").onclick=()=>examRunner({...cfg,qs:cfg.regen?cfg.regen():cfg.qs});
    $("#bk2").onclick=back; top();
  }
  step(); top();
}
function drawCompare(p,el,u){
  const r=p.rivals[u.r], key=p.id+u.r, shown=!!u.rev[key];
  if(u.d==null) u.d={};
  const top=r.stats.slice(0,3), more=r.stats.slice(3);
  const row=([l,a,b,w])=>`<div class="h2h-row">
        <div class="v ${w==="us"?"win":""}">${w==="us"?"✓ ":""}${esc(a)}</div>
        <div class="l">${esc(l)}${w==="tie"?`<span class="tie">tie</span>`:""}</div>
        <div class="v them ${w==="them"?"win":""}">${w==="them"?"✓ ":""}${esc(b)}</div></div>`;
  el.innerHTML=`
  ${p.id==="chrona"?energySection(u):""}
  <h3 class="pickh">Pick a rival</h3>
  <div class="rivalpick">${p.rivals.map((x,i)=>`<button data-r="${i}" aria-pressed="${i===u.r}"><span class="rp-img">${themVisual(x)}</span><span>${esc(x.n)}</span></button>`).join("")}</div>
  <article class="duel duel2">
    <div class="faceoff rv">
      <figure class="side us"><div class="fplate"><img src="${IMG[p.img]}" alt="${esc(p.name)}"></div><figcaption>${esc(p.name)}</figcaption></figure>
      <div class="vsmark">VS</div>
      <figure class="side them"><div class="fplate">${themVisual(r)}</div><figcaption>${esc(r.n)}</figcaption></figure>
    </div>
    <div class="remember rv"><div class="lbl">The one thing to remember</div><p>${esc(r.one)}</p></div>
    <div class="h2h rv">
      <div class="h2h-head"><span>Dreame</span><span></span><span>${esc(r.n)}</span></div>
      ${top.map(row).join("")}
    </div>
    ${more.length?`<details class="more"><summary>${more.length} more difference${more.length>1?"s":""}</summary><div class="h2h">${more.map(row).join("")}</div></details>`:""}
    <div class="chat rv" style="margin-top:18px">
      <div class="bubble b-them"><small>The customer says</small>${esc(r.they)}</div>
      ${shown?`<div class="bubble b-us"><small>You say</small>${esc(r.you)}</div>`:`<button class="reveal" id="rev">What would you say? Tap to see</button>`}
    </div>
    <p class="dontline rv"><b>Don’t say:</b> ${esc(r.dont)}</p>
    <details class="practice" ${u.popen&&u.popen[key]?"open":""}><summary>Practice: ${r.drill.length} question${r.drill.length>1?"s":""}</summary><div id="drill"></div></details>
  </article>
  <details class="fulltable"><summary>Full spec table</summary>
  <div class="tablebox"><table>
    <thead><tr><th></th>${p.table.cols.map((c,i)=>`<th class="${i===0?"us":""}">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${p.table.rows.map(row=>`<tr><th>${esc(row[0])}</th>${row.slice(1).map((c,i)=>`<td class="${i===0?"us":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div><p class="note">Competitor data from their published materials.</p></details>`;
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{u.r=+b.dataset.r;drawCompare(p,el,u);el.querySelector(".duel").scrollIntoView({block:"start",behavior:RM?"auto":"smooth"});window.scrollBy(0,-120);});
  const rv=$("#rev"); if(rv) rv.onclick=()=>{u.rev[key]=1;drawCompare(p,el,u);};
  const pr=el.querySelector(".practice"); pr.ontoggle=()=>{u.popen=u.popen||{};u.popen[key]=pr.open;};
  drawDrill(p,r,key,u);
  observe(el);
}
function drawDrill(p,r,key,u){
  const box=$("#drill"); const di=u.d[key]||0;
  if(di>=r.drill.length){
    const nxt=(u.r+1)%p.rivals.length;
    box.innerHTML=`<div class="fb right"><strong>Done with ${esc(r.n)}!</strong>You’re ready for this rival.</div>
      <div class="btnrow"><button class="btn" id="dr-again">Practice again</button>${p.rivals.length>1?`<button class="btn main" id="dr-next">Next rival: ${esc(p.rivals[nxt].n)}</button>`:""}</div>`;
    $("#dr-again").onclick=()=>{u.d[key]=0;drawCompare(p,$("#panel"),u);};
    const n=$("#dr-next"); if(n) n.onclick=()=>{u.r=nxt;drawCompare(p,$("#panel"),u);window.scrollTo({top:$(".tabs").offsetTop-56});};
    return;
  }
  const R=r.drill[di], ord=R.o.map((_,j)=>j); if(R.o.length>2) ord.sort(()=>Math.random()-.5);
  const Q={...R,o:ord.map(j=>R.o[j]),a:ord.indexOf(R.a)};
  box.innerHTML=`<div class="drillq"><p class="dq">${esc(Q.q)}</p><div class="opts">${Q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div id="dfb"></div></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j, ok=j===Q.a;
    box.querySelectorAll(".opt").forEach((x,xi)=>{x.disabled=true;if(xi===Q.a)x.classList.add("right");else if(xi===j)x.classList.add("wrong");});
    $("#dfb").innerHTML=`<div class="fb ${ok?"right":"wrong"}"><strong>${ok?"Correct!":"Not quite."}</strong>${esc(Q.w)}</div><div class="btnrow"><button class="btn main" id="dnx">${di<r.drill.length-1?"Next question":"Finish"}</button></div>`;
    $("#dnx").onclick=()=>{u.d[key]=di+1;drawCompare(p,$("#panel"),u);const t=$("#drill");if(t)t.scrollIntoView({block:"center"});};
  });
}

/* ---------- quiz engine ---------- */
function runQuiz(el,qs,onDone,onBack,tags){
  let i=0,score=0;
  function q(){
    const R=qs[i], ord=R.o.map((_,j)=>j).sort(()=>Math.random()-.5);
    const Q={...R,o:ord.map(j=>R.o[j]),a:ord.indexOf(R.a)};
    el.innerHTML=`<div class="quiz">
      <div class="qmeta"><span>Question ${i+1} of ${qs.length}</span><span>${tags&&tags[i]?`<span class="ptag">${esc(tags[i])}</span>`:`Correct: ${score}`}</span></div>
      <h2>${esc(Q.q)}</h2>
      <div class="opts">${Q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>
      <div id="fb"></div></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j, ok=j===Q.a; if(ok) score++;
      el.querySelectorAll(".opt").forEach((x,xi)=>{x.disabled=true; if(xi===Q.a) x.classList.add("right"); else if(xi===j) x.classList.add("wrong");});
      $("#fb",el).innerHTML=`<div class="fb ${ok?"right":"wrong"}"><strong>${ok?"Correct!":"Not quite."}</strong>${esc(Q.w)}</div>
        <div class="btnrow"><button class="btn main" id="nx">${i<qs.length-1?"Next question":"See result"}</button></div>`;
      $("#nx",el).onclick=()=>{i++; i<qs.length?q():end();};
      $("#nx",el).focus();
    });
  }
  function end(){
    onDone(score);
    const pct=score/qs.length;
    el.innerHTML=`<div class="quiz result">
      <div class="big">${score}/${qs.length}</div>
      <h2 style="margin-top:10px">${pct===1?"Perfect! You’re ready to sell.":pct>=0.6?"Good. Review the ones you missed.":"Worth reviewing the selling points again."}</h2>
      <div class="btnrow" style="justify-content:center"><button class="btn main" id="again">Try again</button>${onBack?`<button class="btn" id="bk">Go back and review</button>`:""}</div></div>`;
    $("#again",el).onclick=()=>runQuiz(el,qs,onDone,onBack,tags);
    if(onBack) $("#bk",el).onclick=onBack;
  }
  q();
}

function buildFull(){

  PRODUCTS.forEach(p=>["s","m","tf"].forEach(t=>EXAMS[p.id].filter(q=>q.t===t).sort(()=>Math.random()-.5).slice(0,n[t]).forEach(q=>by[t].push({...q,pid:p.id}))));
  return ["s","m","tf"].flatMap(t=>by[t].sort(()=>Math.random()-.5));
}
